<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solus — The Smartest Robotics Tool You'll Ever Need</title>
<meta name="description" content="Solus — code, CAD, PCB design and telemetry in one place. solusforge.com">
<link rel="icon" href="solus-qr.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#04060a;font-family:Inter,system-ui,sans-serif;color:#e8ecf2;overflow:hidden}
a{color:#4c8dff;text-decoration:none}a:hover{color:#7fadff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes gridDrift{from{background-position:0 0}to{background-position:0 -26px}}
@keyframes heroGlow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes ringSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes ringSpinRev{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
@keyframes dashFlow{to{stroke-dashoffset:-30}}
@keyframes nodeGlow{0%,100%{filter:drop-shadow(0 0 6px rgba(127,173,255,.35))}50%{filter:drop-shadow(0 0 18px rgba(127,173,255,.8))}}
@keyframes wordFade{0%{opacity:0;transform:translateY(10px)}4%,27%{opacity:1;transform:translateY(0)}32%,100%{opacity:0;transform:translateY(-10px)}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
</style>
</head>
<body>
<div style="position:fixed;inset:0;background:radial-gradient(1200px 800px at 50% 42%, #0b1424 0%, #04060a 65%);display:flex;align-items:center;justify-content:center">
  <div style="position:absolute;inset:0;background-image:radial-gradient(#111826 1px, transparent 1px);background-size:26px 26px;animation:gridDrift 4s linear infinite;opacity:.7"></div>
  <div style="position:absolute;left:50%;top:42%;width:640px;height:640px;transform:translate(-50%,-50%);background:radial-gradient(closest-side, rgba(47,107,220,.16), transparent 70%);animation:heroGlow 6s ease-in-out infinite;pointer-events:none"></div>
  <svg style="position:absolute;left:50%;top:42%;width:560px;height:560px;transform:translate(-50%,-50%);overflow:visible" viewBox="0 0 560 560">
    <g style="transform-origin:280px 280px;animation:ringSpin 60s linear infinite">
      <circle cx="280" cy="280" r="235" fill="none" stroke="#1a2436" stroke-width="1.5" stroke-dasharray="4 10"></circle>
      <circle cx="280" cy="45" r="5" fill="#2f6bdc"></circle>
      <circle cx="483" cy="397" r="4" fill="#1e3a66"></circle>
    </g>
    <g style="transform-origin:280px 280px;animation:ringSpinRev 90s linear infinite">
      <circle cx="280" cy="280" r="180" fill="none" stroke="#141c2b" stroke-width="1.5"></circle>
      <circle cx="460" cy="280" r="4" fill="#7fadff" style="animation:pulse 3s infinite"></circle>
      <circle cx="100" cy="280" r="3.5" fill="#2a6b52"></circle>
    </g>
    <circle cx="280" cy="280" r="278" fill="none" stroke="#b98a2e" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="8 14" style="transform-origin:280px 280px;animation:ringSpin 140s linear infinite"></circle>
  </svg>
  <div style="position:relative;text-align:center;top:-8vh">
    <div style="animation:floatY 7s ease-in-out infinite">
      <svg width="190" height="190" viewBox="0 0 120 120" style="animation:nodeGlow 5s ease-in-out infinite"><polygon points="90,26 38,44 82,76 30,94" fill="#0b0e13"></polygon><path d="M90 26 L38 44 L82 76 L30 94" stroke="#2f6bdc" stroke-width="5" stroke-linecap="round" fill="none" stroke-dasharray="8 7" style="animation:dashFlow 2.2s linear infinite"></path><circle cx="90" cy="26" r="10" fill="#0b0e13" stroke="#4c8dff" stroke-width="5"></circle><circle cx="30" cy="94" r="10" fill="#0b0e13" stroke="#4c8dff" stroke-width="5"></circle><circle cx="38" cy="44" r="14" fill="#7fadff"></circle><circle cx="82" cy="76" r="14" fill="#7fadff"></circle></svg>
    </div>
    <div style="margin-top:34px;font-size:64px;font-weight:800;letter-spacing:-.03em;background:linear-gradient(100deg,#e8ecf2 35%,#7fadff 50%,#e8ecf2 65%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 7s linear infinite">Solus</div>
    <div style="margin-top:18px;font-size:22px;color:#e8ecf2;font-weight:500;letter-spacing:-.01em">The Smartest Robotics Tool You&#39;ll Ever Need</div>
    <div style="position:relative;height:30px;margin-top:26px">
      <div id="cap" style="position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.22em;color:#48536a;opacity:1;transition:opacity .6s ease">CODE · CAD · PCB DESIGN · TELEMETRY</div>
    </div>
  </div>
  <div style="position:absolute;bottom:34px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:10px">
    <span style="width:7px;height:7px;border-radius:50%;background:#3ddc97;animation:pulse 2.4s infinite"></span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.18em;color:#5b6577">SOLUSFORGE.COM</span>
  </div>
  <div style="position:absolute;bottom:28px;right:32px;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:.85">
    <img src="solus-qr.png" alt="solusforge.com" style="width:150px;height:150px;border-radius:12px;background:#fff;padding:6px;box-sizing:border-box">
    <span style="font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.2em;color:#48536a">SCAN ME</span>
  </div>
</div>
<script>
// Rotating caption — same state machine as the design's DCLogic component:
// fade out, swap the line 650ms later, fade back in, every 4s.
(function () {
  var lines = [
    'CODE · CAD · PCB DESIGN · TELEMETRY',
    'SOFTWARE · HARDWARE · ELECTRICAL · SIMULATION',
    'THE GREATEST ROBOTICS TOOL YOU COULD EVER HAVE'
  ];
  var cap = document.getElementById('cap');
  var idx = 0;
  setInterval(function () {
    cap.style.opacity = '0';
    setTimeout(function () {
      idx = (idx + 1) % lines.length;
      cap.textContent = lines[idx];
      cap.style.opacity = '1';
    }, 650);
  }, 4000);
})();
</script>
</body>
</html>
